schema {
    query: RootQuery
}

"""
Entry point for querying skills in a repository.
"""
type RootQuery {
    """
    All valid skills in the repository (SKILL.md at correct nesting depth).
    """
    Skill: [Skill!]!

    """
    All group folders directly under the skills root.
    """
    GroupFolder: [GroupFolder!]!

    """
    Every SKILL.md file discovered in the repository, regardless of location.
    Includes files at valid depths and invalid depths (flat layout, too deep, etc.).
    Lints filter on `depth` to detect structural violations.
    """
    DiscoveredSkillFile: [DiscoveredSkillFile!]!

    """
    All directories at skill depth (>= 2 levels under skills root), regardless
    of whether they contain a SKILL.md. Enables lints that detect directories
    that should be skills but are missing their SKILL.md.
    """
    DiscoveredDirectory: [DiscoveredDirectory!]!

    """
    The configured GitHub organization. Provides access to org teams for validation.
    Requires a GitHub token (GITHUB_TOKEN or GH_TOKEN env var).
    """
    GitHubOrg: GitHubOrg!
}

# ---------------------------------------------------------------------------
# Core types
# ---------------------------------------------------------------------------

"""
A skill discovered in the repository.
A valid skill is a directory containing a SKILL.md file at the correct nesting depth.
"""
type Skill {
    # ---- Identity & location ----

    """The directory name of the skill folder (e.g. "query-authoring")."""
    folder_name: String!

    """The group folder name this skill is nested under (e.g. "elasticsearch")."""
    group_folder: String!

    """Relative path from the repo root to the skill directory."""
    path: String!

    """Relative path from the repo root to the SKILL.md file."""
    skill_file_path: String!

    """Nesting depth under the skills root (valid skills are at depth 3)."""
    depth: Int!

    # ---- Frontmatter properties ----

    """Whether the SKILL.md file has valid YAML frontmatter delimiters."""
    has_frontmatter: Boolean!

    """The raw YAML frontmatter text, if present."""
    raw_frontmatter: String

    """The `name` field from frontmatter, if present."""
    name: String

    """The `description` field from frontmatter, if present."""
    description: String

    """The `license` field from frontmatter, if present."""
    license: String

    """The `compatibility` field from frontmatter, if present."""
    compatibility: String

    """The `allowed-tools` field from frontmatter, if present."""
    allowed_tools: String

    """Character count of the description field."""
    description_length: Int!

    """Word count of the description field."""
    description_word_count: Int!

    # ---- Body properties ----

    """Total line count of the SKILL.md file."""
    total_line_count: Int!

    """Line count of the markdown body (excluding frontmatter)."""
    body_line_count: Int!

    """Whether the body starts with a level-1 heading."""
    has_title_heading: Boolean!

    """The text of the first level-1 heading, if present."""
    title_heading: String

    # ---- Edges ----

    """Frontmatter metadata key-value pairs."""
    metadata: [MetadataEntry!]!

    """All markdown sections (## headings) in the body."""
    section: [Section!]!

    """All subdirectories of this skill (scripts/, references/, assets/, etc.)."""
    sub_dir: [SubDir!]!

    """
    Files sitting directly in the skill folder alongside SKILL.md (not in
    subdirectories). Useful for detecting misplaced files that should be in
    scripts/, references/, etc.
    """
    root_file: [SubDirFile!]!

    """Local path references found in the SKILL.md body (markdown links and images)."""
    referenced_path: [ReferencedPath!]!

    """
    All other skills in the repository (excluding this one).
    Enables cross-skill comparisons (duplicate names, overlapping descriptions, etc.)
    entirely within .ron queries using @tag + @filter.
    """
    all_other_skills: [Skill!]!

    """Span information for the SKILL.md file (for error reporting)."""
    span: Span!

    """Span of the frontmatter block within SKILL.md."""
    frontmatter_span: Span

    """The configured GitHub organization (for team validation, etc.)."""
    github_org: GitHubOrg!
}

"""
A grouping folder directly under the skills root (e.g. "elasticsearch", "kibana").
"""
type GroupFolder {
    """The folder name."""
    name: String!

    """Relative path from the repo root."""
    path: String!

    """Skills nested under this group folder."""
    skill: [Skill!]!

    """Count of skills in this group."""
    skill_count: Int!
}

"""
A SKILL.md file discovered anywhere in the repository tree.
Not all discovered files are valid skills — some may be at wrong depths.
"""
type DiscoveredSkillFile {
    """Relative path from the repo root."""
    path: String!

    """The parent directory name."""
    parent_dir: String!

    """Nesting depth under the skills root."""
    depth: Int!

    """The resolved Skill, if this file is at a valid location and parseable."""
    skill: Skill

    span: Span!
}

"""
A directory discovered under the skills root at depth >= 2 (the expected skill
directory depth). Includes directories both with and without a SKILL.md, enabling
lints that detect directories that should contain a skill definition but don't.
"""
type DiscoveredDirectory {
    """The directory name (e.g. "query-authoring")."""
    name: String!

    """Relative path from the repo root."""
    path: String!

    """
    Nesting depth under the skills root (number of path components).
    Skill directories are typically at depth 2 (group/skill-name).
    """
    depth: Int!

    """Whether this directory contains a SKILL.md file."""
    has_skill_file: Boolean!

    """Count of non-SKILL.md files directly in this directory."""
    file_count: Int!

    """Non-SKILL.md files directly in this directory."""
    file: [SubDirFile!]!

    """The resolved Skill, if this directory contains a valid skill."""
    skill: Skill

    span: Span!
}

# ---------------------------------------------------------------------------
# Markdown structure
# ---------------------------------------------------------------------------

"""
A markdown section identified by a heading (## level).
"""
type Section {
    """The heading level (1 = #, 2 = ##, etc.)."""
    level: Int!

    """The heading text (without the # prefix)."""
    heading: String!

    """The line number where this heading appears."""
    line_number: Int!

    """The full text content under this heading (until the next heading of same or higher level)."""
    content: String!

    """Line count of this section's content."""
    content_line_count: Int!

    """Code blocks within this section."""
    code_block: [CodeBlock!]!
}

"""
A fenced code block within markdown.
"""
type CodeBlock {
    """The language tag (e.g. "json", "yaml", "bash"), if specified."""
    language: String

    """Whether a language tag is present."""
    has_language_tag: Boolean!

    """The line number where the code block starts."""
    line_number: Int!

    """The content of the code block."""
    content: String!
}

# ---------------------------------------------------------------------------
# Filesystem structure (generic)
# ---------------------------------------------------------------------------

"""
A subdirectory of a skill (scripts/, references/, assets/, or any future subdirectory).
"""
type SubDir {
    """The directory name (e.g. "scripts", "references", "assets")."""
    name: String!

    """Relative path from the repo root."""
    path: String!

    """All files in this subdirectory."""
    file: [SubDirFile!]!

    """Total number of files."""
    file_count: Int!

    """Unique file extensions across all files."""
    unique_extensions: [String!]!

    """Number of unique non-data-file extensions."""
    unique_extension_count: Int!
}

"""
A file inside a skill subdirectory.
"""
type SubDirFile {
    """File name."""
    name: String!

    """File extension."""
    extension: String!

    """Relative path from the repo root."""
    path: String!

    """
    Whether this file is classified as a data file (e.g. .json, .yaml, .csv).
    Classification is driven by the `data_extensions` list in .skill-validator.toml.
    """
    is_data_file: Boolean!

    """
    The text content of the file. Null if the file is binary, non-UTF-8, or
    exceeds the size limit (1 MB).
    """
    content: String

    """Local path references extracted from the file (imports, source commands, etc.)."""
    referenced_path: [ReferencedPath!]!
}

# ---------------------------------------------------------------------------
# Reference tracking
# ---------------------------------------------------------------------------

"""
A local path reference found in a skill file (SKILL.md link, JS import, etc.).
Used to detect cross-skill dependencies and references to paths outside a
skill's own directory.
"""
type ReferencedPath {
    """The raw path string as it appears in the source (e.g. '../../shared/es-client.js')."""
    raw_path: String!

    """
    The path normalized to be repo-root-relative (e.g. 'skills/shared/es-client.js').
    Null if the path could not be resolved (e.g. a bare package name that passed
    through filtering).
    """
    resolved_path: String

    """
    The kind of reference. One of: markdown_link, markdown_image, js_import,
    js_require, js_dynamic_import, python_relative_import, shell_source.
    """
    kind: String!

    """1-based line number where the reference appears in the source file."""
    line_number: Int!
}

# ---------------------------------------------------------------------------
# Metadata & utility types
# ---------------------------------------------------------------------------

"""
A key-value pair from the frontmatter `metadata` map.
When the YAML value is itself a mapping, `children` contains its nested entries.
"""
type MetadataEntry {
    key: String!
    value: String!

    """Child entries when the value is a YAML mapping (empty otherwise)."""
    children: [MetadataEntry!]!
}

"""
The GitHub organization. Contains team data fetched from the GitHub API.
Check `teams_loaded` before relying on team data — it is false when no
GitHub token was available.
"""
type GitHubOrg {
    """The organization name (e.g. "elastic")."""
    name: String!

    """Whether teams were successfully loaded from the GitHub API."""
    teams_loaded: Boolean!

    """Number of teams loaded (0 when teams_loaded is false)."""
    team_count: Int!

    """All teams in the organization."""
    team: [GitHubTeam!]!
}

"""
A team within a GitHub organization.
"""
type GitHubTeam {
    """The team's URL slug (e.g. "clients-team")."""
    slug: String!

    """The team's display name."""
    name: String!

    """The team's description, if set."""
    description: String
}

"""
Source location information for error reporting.
"""
type Span {
    """Relative file path from the repo root."""
    filename: String!

    """1-based starting line number."""
    begin_line: Int!

    """1-based ending line number."""
    end_line: Int!
}
