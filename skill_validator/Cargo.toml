[package]
name = "skill-validator"
version = "0.6.1"
edition = "2021"
rust-version = "1.77"
description = "A Trustfall-powered linting tool for validating Agent Skills repositories"
license = "Apache-2.0"

[[bin]]
name = "skill-validator"
path = "src/main.rs"

[dependencies]
trustfall = "0.8"
trustfall_derive = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
ron = "0.8"
pulldown-cmark = "0.13"
clap = { version = "4", features = ["derive"] }
handlebars = "6"
toml = "0.8"
fs-err = "3"
walkdir = "2"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
csv = "1"
comfy-table = "7"
anyhow = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
insta = "1"
tempfile = "3.26.0"
